name: Build Labtech Scheduler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore LabtechScheduler.csproj

    - name: Build Solution
      run: msbuild LabtechScheduler.csproj /p:Configuration=Release /p:Platform="AnyCPU"

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabtechScheduler-App
        path: bin/Release/LabtechScheduler.exe
